<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strictly Medical</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0c11">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strictly Medical">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <canvas id="game" aria-label="Strictly Medical"></canvas>
  <div class="touch">
    <button type="button" data-k="act" data-hold="1">Use</button>
    <button type="button" data-k="heal">Flask</button>
    <button type="button" data-k="skill">Skill</button>
    <button type="button" data-k="roll">Dodge</button>
    <button type="button" data-k="atk" class="big">Strike</button>
  </div>
  <div class="panel" id="panel" hidden></div>
</div>

<script src="js/sprites.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/input.js"></script>
<script src="js/combat.js"></script>
<script src="js/actors.js"></script>
<script src="js/ui.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
</html>
