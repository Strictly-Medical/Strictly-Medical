<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strictly Medical</title>
<link rel="manifest" href="manifest.webmanifest?v=4">
<meta name="theme-color" content="#0d0c11">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strictly Medical">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="preload" as="image" href="assets/ui/title-bg.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="stage">
  <canvas id="game" aria-label="Strictly Medical"></canvas>
  <button type="button" class="pause-btn" id="pause-btn" aria-label="Pause"><span></span><span></span></button>
  <div class="touch">
    <button type="button" data-k="atk" class="big">Strike</button>
    <button type="button" data-k="roll" class="b-roll">Dodge</button>
    <button type="button" data-k="skill" class="b-skill">Skill</button>
    <button type="button" data-k="heal" class="b-heal">Flask</button>
    <button type="button" data-k="act" data-hold="1" class="b-act">Use</button>
  </div>
  <div class="dpad" aria-label="Movement pad">
    <div class="dpad-ring">
      <span class="arm a-up" data-dir="up"></span><span class="arm a-right" data-dir="right"></span>
      <span class="arm a-down" data-dir="down"></span><span class="arm a-left" data-dir="left"></span>
      <span class="hub"></span>
    </div>
    <svg class="dp-arrow d-up" viewBox="0 0 20 20" style="transform:rotate(45deg)" aria-hidden="true"><path d="M10 1.5 L17.5 17 L10 12.6 L2.5 17 Z"/></svg><svg class="dp-arrow d-right" viewBox="0 0 20 20" style="transform:rotate(135deg)" aria-hidden="true"><path d="M10 1.5 L17.5 17 L10 12.6 L2.5 17 Z"/></svg><svg class="dp-arrow d-down" viewBox="0 0 20 20" style="transform:rotate(225deg)" aria-hidden="true"><path d="M10 1.5 L17.5 17 L10 12.6 L2.5 17 Z"/></svg><svg class="dp-arrow d-left" viewBox="0 0 20 20" style="transform:rotate(315deg)" aria-hidden="true"><path d="M10 1.5 L17.5 17 L10 12.6 L2.5 17 Z"/></svg>
  </div>
  <section class="title" id="title" hidden aria-label="Title screen">
    <div class="title-bg" aria-hidden="true"></div>
    <canvas class="title-embers" id="title-embers" aria-hidden="true"></canvas>
    <div class="title-shade" aria-hidden="true"></div>
    <div class="title-main">
      <img class="title-emblem" src="assets/ui/emblem.jpg" alt="">
      <h1 class="title-name">Strictly Medical</h1>
      <p class="title-sub"><span>The Order of the Ninety and Nine</span></p>
      <nav class="title-menu" aria-label="Main menu">
        <button type="button" class="lead" data-menu="begin">Begin</button>
        <button type="button" data-menu="continue" disabled title="No saved game yet">Continue</button>
        <button type="button" data-menu="options">Options</button>
        <button type="button" data-menu="credits">Credits</button>
      </nav>
    </div>
    <p class="title-foot">A strictly medical organization. Any monsters harmed were harmed in self-defense.</p>
  </section>
  <div class="panel" id="panel" hidden></div>
</div>

<script src="js/sprites.js"></script>
<script src="js/tiles2.js"></script>
<script src="js/map-dawnspire.js"></script>
<script src="js/map-spire.js"></script>
<script src="js/core.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/input.js"></script>
<script src="js/combat.js"></script>
<script src="js/actors.js"></script>
<script src="js/ui.js"></script>
<script src="js/title.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{}));</script>
</body>
</html>
